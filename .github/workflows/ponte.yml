name: GEO bridge POC
on:
  push:
    branches: [main]
    paths:
      - 'queue/**'
      - 'results/**'
      - '.github/workflows/ponte.yml'
      - 'bridge.py'
      - 'test_bridge.py'
  workflow_dispatch:
    inputs:
      acao:
        description: 'Enviar teste ou recolher'
        type: choice
        options: [enviar, recolher]
        default: recolher
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: geo-bridge-poc
  cancel-in-progress: false
jobs:
  bridge:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Enviar teste
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'enviar'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            # Apenas um envio automatico de integracao apos o teste inicial.
            if ! python -c 'from pathlib import Path; from bridge import load, valid_return; job=load(Path("queue/job.json")); p=Path("results/poc-gh-2026112301.json"); raise SystemExit(0 if job["job_id"]=="poc-gh-2026112301" and p.exists() and valid_return(job,load(p)) else 1)'; then
              echo "Sem novo teste automatico elegivel"
              exit 0
            fi
          fi
          python bridge.py enviar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queue/job.json
          if ! git diff --cached --quiet; then
            git commit -m "POC: enfileirar teste ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - run: python bridge.py recolher
      - name: Registrar resultado no resumo gratuito do job
        if: always()
        run: |
          if [ -f output/retorno.json ]; then
            echo '### Estado da ponte (teste técnico)' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat output/retorno.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
